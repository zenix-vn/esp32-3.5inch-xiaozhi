# OpenLiteSpeed vhost for kindle.zenix.vn -> Kindle Desk container (/opt/kindle-desk), 127.0.0.1:8095.
# Install as /usr/local/lsws/conf/vhosts/kindle.zenix.vn/kindle.zenix.vn.conf, then in httpd_config.conf add
#   virtualHost kindlezenix { vhRoot kindle.zenix.vn/ ... configFile conf/vhosts/kindle.zenix.vn/kindle.zenix.vn.conf }
#   map kindlezenix kindle.zenix.vn      (in both the HTTP and HTTPS listeners)
# Certificate: certbot certonly --webroot -w /usr/local/lsws/kindle.zenix.vn/html -d kindle.zenix.vn

docRoot                   /usr/local/lsws/kindle.zenix.vn/html
vhDomain                  kindle.zenix.vn
enableGzip                0

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}
accesslog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                30
}

index  {
  useServer               0
  autoIndex               0
  indexFiles              index.html
}

extprocessor kindledeskweb {
  type                    proxy
  address                 127.0.0.1:8095
  maxConns                10
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

rewrite  {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteCond %{HTTPS} !on
RewriteRule ^/?(.*)$ https://kindle.zenix.vn/$1 [R=301,L]
  END_rules
}

context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/kindle.zenix.vn/html/.well-known/acme-challenge/
  allowBrowse             1
}

context / {
  type                    proxy
  handler                 kindledeskweb
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
X-Content-Type-Options nosniff
X-Robots-Tag noindex
  END_extraHeaders
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/kindle.zenix.vn/privkey.pem
  certFile                /etc/letsencrypt/live/kindle.zenix.vn/fullchain.pem
  certChain               1
  sslProtocol             24
}
