[env:esp32-035]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
; sprites, fonts and the wallpaper are drawn straight from flash: read it at 80 MHz (esp32dev default is 40)
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    bblanchon/ArduinoJson@7.0.4
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    ; display on HSPI: pins 12/13/14/15 are its native IO_MUX pins, which allow 80 MHz (the GPIO matrix
    ; used with VSPI tops out at 40). The microSD card moved to VSPI (18/19/23/5, its native pins).
    ; If the screen shows noise, set SPI_FREQUENCY back to 40000000.
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    ; reads (web screenshot only) at 8 MHz: the panel answers slowly and the fast IO_MUX path samples early at 16
    -DSPI_READ_FREQUENCY=8000000
    -DTOUCH_CS=33
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=0
